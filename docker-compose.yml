# Chạy toàn bộ hệ thống bằng 1 lệnh:  docker compose up -d --build
# Web:      http://localhost:5173
# API:      http://localhost:8080/api/health
# Swagger:  http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mushroom
      POSTGRES_PASSWORD: mushroom
      POSTGRES_DB: mushroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mushroom"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/mushroom
      DB_USER: mushroom
      DB_PASSWORD: mushroom
      JWT_SECRET: ${JWT_SECRET:-hay-doi-chuoi-bi-mat-nay-khi-trien-khai-that-0123456789}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-MUSHROOM-ADMIN-2026}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
